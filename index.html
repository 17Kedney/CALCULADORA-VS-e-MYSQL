<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Web Python + MySQL</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="calculadora-container">
        <h2>Calculadora Python</h2>
        
        <form action="/calcular" method="POST" class="calc-form">
            <div class="input-group">
                <input type="number" step="any" name="num1" placeholder="Número 1" required>
                
                <select name="operacao">
                    <option value="soma">+</option>
                    <option value="subtracao">-</option>
                    <option value="multiplicacao">*</option>
                    <option value="divisao">/</option>
                </select>
                
                <input type="number" step="any" name="num2" placeholder="Número 2" required>
            </div>
            
            <button type="submit" class="btn-calcular">Calcular</button>
        </form>

        <!-- Resultado do cálculo atual -->
        {% if resultado is not none %}
            <div class="resultado-box">
                <p>Resultado Atual:</p>
                <strong>{{ resultado }}</strong>
            </div>
        {% endif %}

        <!-- Histórico formatado puxado do MySQL -->
        {% if historico %}
            <div class="historico-container">
                <h4>Últimos Cálculos (MySQL)</h4>
                <table class="historico-tabela">
                    {% for linha in historico %}
                        <tr>
                            <td>{{ linha[0] }}</td>
                            <td class="operador-cor">{{ linha[1] }}</td>
                            <td>{{ linha[2] }}</td>
                            <td>=</td>
                            <td class="resultado-cor">{{ linha[3] }}</td>
                        </tr>
                    {% endfor %}
                </table>
            </div>
        {% endif %}
    </div>

</body>
</html>
